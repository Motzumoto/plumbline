modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/ryanhcode/sable/issues"

[[mods]]
modId = "plumbline"
version = "1.0.0"
displayName = "Plumbline"
logoFile = "icon.png"
description = '''
Sub-level bounds repair for Sable (Create: Aeronautics).

Sable's SubLevelEntityCollision.collide() builds its candidate block set with
BlockPos.betweenClosed(min, max) and never checks the size of that region. A
sub-level whose bounding box doesn't match its actual blocks can push that into
the tens of millions, which locks up the server thread. Seen on a real world:
57.9 million blocks in one region and a tick stuck for 207 seconds, from six
entities.

A guard caps the region the collision scan may walk, and a healer periodically
asks Sable to recalculate bounds that reach outside the world height limits.

Plumbline does not delete anything. If a sub-level can't be repaired it is logged
and left alone. /plumbline report dumps the details for a bug report.

Workaround for ryanhcode/sable issues #857, #338 and #1098.
'''

[[mixins]]
config = "plumbline.mixins.json"

[[dependencies.plumbline]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.plumbline]]
modId = "sable"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"
