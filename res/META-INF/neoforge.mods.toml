modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Motzumoto/plumbline/issues"

[[mods]]
modId = "plumbline"
version = "1.1.0"
displayName = "Plumbline"
logoFile = "icon.png"
description = '''
Keeps entity collision against Sable sub-levels from freezing the server tick.
For Create: Aeronautics.

To decide which blocks an entity might hit, Sable inverse transforms the entity's
swept bounding box into the sub-level's local frame twice, once at its previous
pose and once at its current one, unions the two, and walks every block position
inside. When the sub-level rotated or travelled a long way between those poses the
union spans the gap between them, and one entity step has to walk tens of millions
of positions. Seen on a real world: 57.9 million positions and a tick stuck for
207 seconds.

Only the union is large. Each half is about the size of the entity. So when the
union exceeds 262,144 positions Plumbline collides against the current pose alone,
which keeps collision working and gives up only the tunnelling protection across
that movement. A second check caps the region outright if one still gets through.

Sable caps the same volume at 125,000,000 and skips the pass, a ceiling the 57.9
million case passed straight through.

/plumbline report dumps the collision passes seen, the cap in force, and every
oversized region, in a form worth attaching to a bug report.

Related to ryanhcode/sable issues #857, #338 and #1098.
'''

[[mixins]]
config = "plumbline.mixins.json"

[[dependencies.plumbline]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.plumbline]]
modId = "sable"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"
